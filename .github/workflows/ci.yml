name: Python CI (Dev Branch Only)

on:
  push:
    branches: [ "dev" ]        
  pull_request:
    branches: [ "main" ]        

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]" 

    - name: Check formatting with Black
      run: black --check .

    - name: Lint with Ruff
      run: ruff check .

    - name: Run tests with Pytest
      run: pytest